name: Add Colab Badges to Notebooks

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.ipynb'
  pull_request:
    paths:
      - '**.ipynb'

jobs:
  add-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add Colab badges to notebooks
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          def add_colab_badge(notebook_path):
              """Add Open in Colab badge to a Jupyter notebook."""

              # Get repo info from environment
              github_repo = os.environ['GITHUB_REPOSITORY']
              github_ref = os.environ['GITHUB_REF_NAME']

              with open(notebook_path, 'r', encoding='utf-8') as f:
                  notebook = json.load(f)

              # Construct the Colab URL
              github_path = f"{github_repo}/blob/{github_ref}/{notebook_path}"
              colab_url = f"https://colab.research.google.com/github/{github_path}"

              # Create badge markdown
              badge_cell = {
                  "cell_type": "markdown",
                  "metadata": {},
                  "source": [
                      f"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)]({colab_url})\n"
                  ]
              }

              # Check if first cell already has a Colab badge
              has_badge = (notebook['cells'] and
                          'Open In Colab' in str(notebook['cells'][0].get('source', '')))

              if has_badge:
                  # Update existing badge
                  notebook['cells'][0] = badge_cell
                  print(f"Updated badge in {notebook_path}")
              else:
                  # Insert badge as first cell
                  notebook['cells'].insert(0, badge_cell)
                  print(f"Added badge to {notebook_path}")

              # Write back
              with open(notebook_path, 'w', encoding='utf-8') as f:
                  json.dump(notebook, f, indent=1, ensure_ascii=False)
                  f.write('\n')

              return True

          # Find all notebooks
          notebooks = list(Path('.').rglob('*.ipynb'))

          # Filter out notebooks in .ipynb_checkpoints
          notebooks = [nb for nb in notebooks if '.ipynb_checkpoints' not in str(nb)]

          print(f"Found {len(notebooks)} notebooks")
          for notebook in notebooks:
              add_colab_badge(str(notebook))

          EOF

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.ipynb **/*.ipynb
          git commit -m "Add/update Colab badges [skip ci]"
          git push
